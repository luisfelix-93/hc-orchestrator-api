services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - loadtest-net
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - loadtest-net
  orchestrator-api:
    image: luisffilho/health-check-api:20250824
    container_name: orchestator-api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/health-check-db
      - REDIS_ROST=redis
      - REDIS_PORT=6379
      - CRON_SCHEDULE=*/1 * * * *
    networks:
      - loadtest-net
    depends_on:
      - mongo
      - redis
  worker-api:
    image: luisffilho/health-check-worker:latest
    container_name: worker-api
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    ports:
      - '3001:3001'
    networks:
      - loadtest-net
    depends_on:
      - redis
networks:
  loadtest-net:
    driver: bridge
